# =============================================================================
# Enterprise Document Engine - Local Development
#
# Services:
#   - PostgreSQL 18
#   - Redis
#   - Qdrant
#   - Neo4j
#
# Start:
#   docker compose up -d
#
# Stop:
#   docker compose down
#
# Remove all data:
#   docker compose down -v
# =============================================================================

services:

  # ===========================================================================
  # PostgreSQL
  # ===========================================================================
  postgres:
    image: postgres:16
    container_name: document-engine-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: document_engine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Praveen@2000

    ports:
      - "5433:5432"      # Use 5433 if local PostgreSQL is already running

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d document_engine"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Redis
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: document-engine-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Qdrant
  # ===========================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: document-engine-qdrant
    restart: unless-stopped

    ports:

      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

  # ===========================================================================
  # Neo4j
  # ===========================================================================
  neo4j:
    image: neo4j:5
    container_name: document-engine-neo4j
    restart: unless-stopped

    environment:
      NEO4J_AUTH: neo4j/password

    ports:
      - "7474:7474"
      - "7687:7687"

    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs: