# =============================================================================
# Enterprise AI Platform — Infrastructure Services
# =============================================================================
# Starts all infrastructure required for local development.
#
# Services:
#   - PostgreSQL
#   - Redis
#   - Qdrant
#   - Neo4j
#
# Usage:
#   docker compose up -d
#
# Stop:
#   docker compose down
#
# Remove volumes:
#   docker compose down -v
# =============================================================================

version: "3.9"

services:

  # ===========================================================================
  # PostgreSQL
  # ===========================================================================
  postgres:
    image: postgres:18-alpine
    container_name: enterprise-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: enterprise_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Redis
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: enterprise-ai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ===========================================================================
  # Qdrant
  # ===========================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: enterprise-ai-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # ===========================================================================
  # Neo4j
  # ===========================================================================
  neo4j:
    image: neo4j:5
    container_name: enterprise-ai-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

# =============================================================================
# Persistent Volumes
# =============================================================================
volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
