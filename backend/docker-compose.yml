# =============================================================================
# Enterprise AI Platform — Docker Compose
# =============================================================================
# Starts the backend service with hot-reload for development.
#
# Usage:
#   docker compose up --build
# =============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise-ai-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app        # Hot-reload mounts for development
      - ./pyproject.toml:/app/pyproject.toml
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health').raise_for_status()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s