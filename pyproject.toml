[project]
name = "document-intelligence-platform"
version = "0.1.0"
description = "Enterprise AI Document Intelligence Platform"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "docling",
    "langgraph",
    "langchain",
    "langchain-core",
    "qdrant-client",
    "ollama",
    "redis",
    "celery",
    "loguru",
    "pydantic>=2.10",
    "pydantic-settings",
    "python-dotenv",
    "python-multipart",
    "orjson",
    "httpx",
    "sentence-transformers",
    "aiofiles>=25.1.0",
    "sqlalchemy>=2.0.51",
    "neo4j>=6.2.0",
    "asyncpg",
]
[tool.uv]
